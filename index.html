<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artoon Games - Mobile Game Publisher</title>
  <meta name="description" content="Discover amazing mobile games from Artoon Games">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- HEADER -->
  <header>
    <div class="header-container">
      <!-- Logo -->
      <div class="logo" onclick="window.location.href='index.html'">
        <img src="images/logo.png" alt="Artoon Logo" />
      </div>
      
      <!-- Hamburger Toggle (mobile only) -->
      <button class="menu-toggle" onclick="toggleMenu(event)" aria-label="Toggle menu" aria-expanded="false">☰</button>
      
      <!-- Navigation Menu + Social Icons -->
      <div class="nav-wrapper">
        <nav class="nav-menu">
          <ul>
            <li><a href="index.html" class="active">HOME</a></li>
            <li><a href="blog.html">BLOG</a></li>
            <li><a href="mobile-games.html">MOBILE GAMES</a></li>
            <li><a href="test-games.html">TEST GAMES</a></li>
            <li><a href="about.html">ABOUT US</a></li>
            <li><a href="contact.html">CONTACT US</a></li>
          </ul>
          <div class="social-icons">
            <a href="https://facebook.com" target="_blank" rel="noopener noreferrer">
              <img src="images/facebook.png" alt="Facebook" />
            </a>
            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">
              <img src="images/instagram.png" alt="Instagram" />
            </a>
            <a href="https://twitter.com" target="_blank" rel="noopener noreferrer">
              <img src="images/twitter.png" alt="Twitter" />
            </a>
            <a href="https://youtube.com" target="_blank" rel="noopener noreferrer">
              <img src="images/youtube.png" alt="YouTube" />
            </a>
          </div>
        </nav>
      </div>
    </div>
  </header>
  
  <!-- MAIN CONTENT -->
  <main>
    <section class="explore">
      <h2>Explore More Games</h2>
      
      <!-- Search Bar -->
      <div class="search-container">
        <div class="search-wrapper">
          <input 
            type="text" 
            id="game-search" 
            class="search-input" 
            placeholder="Search for games..."
            autocomplete="off"
          />
          <button class="search-button" aria-label="Search">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path d="M9 17A8 8 0 1 0 9 1a8 8 0 0 0 0 16zM19 19l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
        <!-- Search Results Dropdown -->
        <div id="search-results" class="search-results hidden"></div>
      </div>
      
      <!-- Games Container - Ready for SSG (.njk + .json) -->
      <div id="games-container">
        
        <!-- 
          ============================================
          TEMPLATE FOR SSG (.njk file):
          ============================================
          
          SEARCH FUNCTIONALITY WITH .NJK:
          
          In your .njk template, add this before closing </body>:
          
          <script>
            const gamesData = {{ games | dump | safe }};
            // Search logic will automatically use this data
          </script>
          
          ============================================
          GAME CARDS LOOP:
          ============================================
          
          {% for game in games | featured %}
          <div class="game-card">
            <div class="game-icon">
              <img src="{{ game.images.icon }}" alt="{{ game.name }} Icon" />
            </div>
            <div class="game-info">
              <h3>{{ game.name }}</h3>
              <p>{{ game.description }}</p>
              <div class="download-buttons">
                <a href="{{ game.links.testGame }}" target="_blank" rel="noopener noreferrer">
                  GET IT ON Google Play
                </a>
              </div>
            </div>
            <div class="game-promo">
              <img src="{{ game.images.promo }}" alt="{{ game.name }} Promo" />
            </div>
          </div>
          {% endfor %}
          
          ============================================
          DATA FORMAT (games.json):
          ============================================
          
          [
            {
              "name": "Your Game Name",
              "description": "Game description here",
              "featured": true,
              "images": {
                "icon": "images/games/your-game/icon.png",
                "promo": "images/games/your-game/promo.jpg"
              },
              "links": {
                "testGame": "https://your-test-game-url.com",
                "googlePlay": "https://play.google.com/...",
                "appStore": "https://apps.apple.com/..."
              }
            }
          ]
        -->
        
        <!-- Placeholder (remove this when using SSG) -->
        <div class="game-card">
          <div class="game-icon">
            <img src="images/game-icon.png" alt="Game Icon" />
          </div>
          <div class="game-info">
            <h3>Game Title</h3>
            <p>Game description will appear here. Add games in games.json file.</p>
            <div class="download-buttons">
              <a href="#" onclick="alert('Add game link in games.json'); return false;">
                GET IT ON Google Play
              </a>
            </div>
          </div>
          <div class="game-promo">
            <img src="images/game-promo.jpg" alt="Game Promo" />
          </div>
        </div>
        
      </div>
    </section>
  </main>
  
  <!-- FOOTER -->
  <footer>
    <p>&copy; 2025 Artoon Games. All rights reserved.</p>
  </footer>
  
  <!-- Floating Contact Button -->
  <a href="contact.html" class="floating-contact" aria-label="Contact Us">
    <img src="images/contact-icon.png" alt="Contact" />
  </a>
  
  <!-- JavaScript -->
  <script>
    // ==========================================
    // Mobile Menu Toggle (Google Translate Compatible)
    // ==========================================
    function toggleMenu(event) {
      // Prevent default and stop propagation
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }
      
      // Use setTimeout to handle Google Translate delay
      setTimeout(function() {
        const navWrapper = document.querySelector('.nav-wrapper');
        const menuToggle = document.querySelector('.menu-toggle');
        
        if (!navWrapper || !menuToggle) {
          console.warn('Menu elements not found');
          return;
        }
        
        navWrapper.classList.toggle('show');
        
        if (navWrapper.classList.contains('show')) {
          menuToggle.innerHTML = '✕';
          menuToggle.setAttribute('aria-expanded', 'true');
        } else {
          menuToggle.innerHTML = '☰';
          menuToggle.setAttribute('aria-expanded', 'false');
        }
      }, 50);
    }
    
    // ==========================================
    // Close menu when clicking outside (mobile)
    // ==========================================
    document.addEventListener('click', function(event) {
      if (window.innerWidth <= 768) {
        setTimeout(function() {
          const navWrapper = document.querySelector('.nav-wrapper');
          const menuToggle = document.querySelector('.menu-toggle');
          const header = document.querySelector('header');
          
          if (!navWrapper || !menuToggle || !header) return;
          
          // Check if clicked outside header
          if (!header.contains(event.target) && navWrapper.classList.contains('show')) {
            navWrapper.classList.remove('show');
            menuToggle.innerHTML = '☰';
            menuToggle.setAttribute('aria-expanded', 'false');
          }
        }, 50);
      }
    });
    
    // ==========================================
    // Close menu when clicking link (mobile)
    // ==========================================
    document.addEventListener('DOMContentLoaded', function() {
      // Use event delegation for better compatibility
      document.body.addEventListener('click', function(event) {
        if (window.innerWidth <= 768) {
          const target = event.target.closest('.nav-menu a');
          
          if (target) {
            setTimeout(function() {
              const navWrapper = document.querySelector('.nav-wrapper');
              const menuToggle = document.querySelector('.menu-toggle');
              
              if (!navWrapper || !menuToggle) return;
              
              navWrapper.classList.remove('show');
              menuToggle.innerHTML = '☰';
              menuToggle.setAttribute('aria-expanded', 'false');
            }, 100);
          }
        }
      });
    });
    
    // ==========================================
    // Reset menu on resize
    // ==========================================
    let resizeTimer;
    window.addEventListener('resize', function() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function() {
        const navWrapper = document.querySelector('.nav-wrapper');
        const menuToggle = document.querySelector('.menu-toggle');
        
        if (!navWrapper || !menuToggle) return;
        
        if (window.innerWidth > 768) {
          navWrapper.classList.remove('show');
          menuToggle.innerHTML = '☰';
          menuToggle.setAttribute('aria-expanded', 'false');
        }
      }, 100);
    });
    
    // ==========================================
    // Handle Google Translate mutation
    // ==========================================
    if (typeof MutationObserver !== 'undefined') {
      const observer = new MutationObserver(function(mutations) {
        // Re-attach event listeners if DOM changes
        const menuToggle = document.querySelector('.menu-toggle');
        if (menuToggle && !menuToggle.hasAttribute('data-listener-attached')) {
          menuToggle.setAttribute('data-listener-attached', 'true');
        }
      });
      
      observer.observe(document.body, {
        childList: true,
        subtree: true
      });
    }
    
    // ==========================================
    // GAME SEARCH FUNCTIONALITY
    // ==========================================
    
    // Games data - Will be populated from games.json via SSG
    // Example format:
    // const gamesData = [
    //   {
    //     "name": "Game Name",
    //     "description": "Game description",
    //     "category": "Category",
    //     "images": { "icon": "path/to/icon.png" },
    //     "links": { "testGame": "https://game-url.com" }
    //   }
    // ];
    
    const gamesData = []; // Empty - Add your games here or load from JSON
    
    // Search input handler
    const searchInput = document.getElementById('game-search');
    const searchResults = document.getElementById('search-results');
    
    if (searchInput && searchResults) {
      searchInput.addEventListener('input', function(e) {
        const query = e.target.value.trim().toLowerCase();
        
        if (query.length < 2) {
          searchResults.classList.add('hidden');
          searchResults.innerHTML = '';
          return;
        }
        
        // Check if games data exists
        if (gamesData.length === 0) {
          searchResults.innerHTML = '<div class="search-no-results">No games available yet. Add games in games.json</div>';
          searchResults.classList.remove('hidden');
          return;
        }
        
        // Filter games
        const filtered = gamesData.filter(game => 
          game.name.toLowerCase().includes(query) ||
          game.description.toLowerCase().includes(query) ||
          game.category.toLowerCase().includes(query)
        );
        
        // Display results
        if (filtered.length > 0) {
          searchResults.innerHTML = filtered.map(game => `
            <a href="${game.links.testGame}" class="search-result-item">
              <img src="${game.images.icon}" alt="${game.name}" class="search-result-icon" />
              <div class="search-result-info">
                <div class="search-result-name">${game.name}</div>
                <div class="search-result-category">${game.category}</div>
              </div>
            </a>
          `).join('');
          searchResults.classList.remove('hidden');
        } else {
          searchResults.innerHTML = '<div class="search-no-results">No games found</div>';
          searchResults.classList.remove('hidden');
        }
      });
      
      // Close search results when clicking outside
      document.addEventListener('click', function(e) {
        if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
          searchResults.classList.add('hidden');
        }
      });
      
      // Clear search on escape
      searchInput.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          searchInput.value = '';
          searchResults.classList.add('hidden');
        }
      });
    }
  </script>
</body>
</html>
